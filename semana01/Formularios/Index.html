<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>
</head>
<body>
    <main>
        <h1>Formularios + Inputs</h1>

        <form>
            <h2>Inputs</h2>

            <label for="input1">Input tipo texto</label>
            <input id="input1" placeholder="Ingresa algún texto" />

            <label>
                Input solo lectura
                <input/>
            </label>
            <label>
                Input readonly
                <input readonly value="Copia este código" type="text" />
            </label>

             <label>
                Input desactivado
                <input disabled placeholder="Input desativado" type="text" />
            </label>
        </form>
    </main>
</body>
</html>
